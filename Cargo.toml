[package]
name = "air-selangor-mcp"
version = "1.0.0"
edition = "2021"
authors = ["Visveswaran Vaidyanathan"]
license = "SEE LICENSE IN LICENSE"
description = "Model Context Protocol (MCP) server for Air Selangor utilities via Steel.dev and Protobuf 3"

[lib]
name = "air_selangor_mcp"
path = "src/lib.rs"

[[bin]]
name = "air-selangor-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chromiumoxide = "0.9.1"
futures = "0.3"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"
anyhow = "1.0"

[build-dependencies]
prost-build = "0.14"
